<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrarse | Dulce Tentación</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --pink:#E4127C;
    --pink-light:#FBD7E9;
    --coral:#F4A261;
    --cream:#FFF8F5;
    --ink:#3A2E33;
    --gray:#8C7B82;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

header a{
    text-decoration:none;
    font-family:'Fredoka',sans-serif;
    font-size:28px;
    color:#d63384;
}

main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.card h1{
    color:#d63384;
    margin-bottom:10px;
    font-family:'Fredoka',sans-serif;
}

.subtitle{
    color:gray;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

input:focus{
    border:1px solid #d63384;
}

button{
    width:100%;
    margin-top:25px;
    padding:13px;
    background:#d63384;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#b6256d;
}

.error-msg{
    display:none;
    margin-top:15px;
    background:#ffd7d7;
    color:red;
    padding:10px;
    border-radius:8px;
}

.footer-text{
    margin-top:20px;
    text-align:center;
}

.footer-text a{
    color:#d63384;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
    <a href="../index.php">Dulce Tentación</a>
</header>

<main>

<div class="card">

<h1>Crear cuenta</h1>

<p class="subtitle">
Regístrate para comenzar.
</p>

<div class="error-msg" id="errorMsg"></div>

<form id="registerForm" action="registrar.php" method="POST">

<label>Nombre</label>
<input
type="text"
name="nombre"
required>

<label>Correo</label>
<input
type="email"
name="correo"
required>

<label>Teléfono</label>
<input
type="text"
name="telefono"
required>

<label>Usuario</label>
<input
type="text"
name="usuario"
required>

<label>Contraseña</label>
<input
type="password"
id="password"
name="contrasena"
required>

<label>Confirmar contraseña</label>
<input
type="password"
id="confirmPassword"
required>

<button type="submit">
Registrarse
</button>

</form>

<p class="footer-text">
¿Ya tienes cuenta?
<a href="iniciar.html">Inicia sesión</a>
</p>

</div>

</main>

<script>

const form=document.getElementById("registerForm");
const error=document.getElementById("errorMsg");

form.addEventListener("submit",function(e){

const pass=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;

if(pass!==confirm){

e.preventDefault();

error.style.display="block";
error.innerHTML="Las contraseñas no coinciden.";

return;

}

if(pass.length<8){

e.preventDefault();

error.style.display="block";
error.innerHTML="La contraseña debe tener mínimo 8 caracteres.";

return;

}

});

</script>

</body>
</html>
